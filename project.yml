name: TANU
options:
  bundleIdPrefix: com.keeman04
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TANU:
    type: application
    platform: iOS
    sources:
      - path: TANU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeman04.tanu.personal
        INFOPLIST_FILE: TANU/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  TANUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TANUTests
    dependencies:
      - target: TANU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeman04.tanu.personal.tests
        CODE_SIGN_STYLE: Automatic

schemes:
  TANU:
    build:
      targets:
        TANU: all
        TANUTests: [test]
    test:
      targets:
        - TANUTests
