name: MAI Android
on:
  push:
    branches: [ main, mai-production, fix-launch-icon-crash, mai-v1-hardening ]
  pull_request:
    branches: [ main ]

concurrency:
  group: mai-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon lintDebug
      - name: Check MAI backend configuration
        env:
          MAI_BACKEND_URL: ${{ secrets.MAI_BACKEND_URL }}
        run: |
          if [ -n "$MAI_BACKEND_URL" ]; then
            echo "MAI backend URL is configured for this APK."
          else
            echo "::warning::MAI_BACKEND_URL is not configured. Recording works, but final Tamil/Tanglish AI enhancement remains in recorded/pending state."
          fi
      - name: Build APK
        env:
          MAI_BACKEND_URL: ${{ secrets.MAI_BACKEND_URL }}
          MAI_GATEWAY_TOKEN: ${{ secrets.MAI_GATEWAY_TOKEN }}
        run: gradle --no-daemon assembleDebug -PMAI_BACKEND_URL="$MAI_BACKEND_URL" -PMAI_GATEWAY_TOKEN="$MAI_GATEWAY_TOKEN"
      - name: Reject oversized APK regressions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          MAX=$((50 * 1024 * 1024))
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::APK is larger than 50 MiB. Check for accidentally packaged speech models/native assets."
            exit 1
          fi
      - name: Ensure Vosk model is not packaged
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eiq 'vosk|model-en-us'; then
            echo "::error::Unused Vosk/English speech model is still packaged."
            exit 1
          fi
          echo "No Vosk speech model found in APK."
      - name: Validate 16 KiB arm64 native alignment
        run: |
          rm -rf /tmp/mai-apk-check
          mkdir -p /tmp/mai-apk-check
          unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/arm64-v8a/*.so' -d /tmp/mai-apk-check || true
          python3 - <<'PY'
          import glob, subprocess, sys
          bad = []
          for path in glob.glob('/tmp/mai-apk-check/lib/arm64-v8a/*.so'):
              text = subprocess.check_output(['readelf', '-lW', path], text=True)
              for line in text.splitlines():
                  parts = line.split()
                  if parts and parts[0] == 'LOAD':
                      align = int(parts[-1], 16)
                      if align < 0x4000:
                          bad.append((path, hex(align)))
                          break
          if bad:
              print('Native libraries not 16 KiB aligned:')
              for path, align in bad:
                  print(f'  {path}: {align}')
              sys.exit(1)
          print('All packaged arm64 native LOAD segments are at least 16 KiB aligned.')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.3.0-Hardened-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Backend unit tests
        run: PYTHONPATH=. pytest -q
      - name: Validate backend module
        run: python -m py_compile app.py

  cold-start-smoke:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android ${{ matrix.api-level }} launcher and integration tests
        id: launcher-smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/mai_launcher_smoke.sh
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAI-diagnostics-api-${{ matrix.api-level }}
          path: |
            cold-start-diagnostics/
            app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce MAI Android result
        run: test -f mai-launch-smoke-passed
