name: MAI Android
on:
  push:
    branches: [ main, mai-production, fix-launch-icon-crash ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.0.1-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  cold-start-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android 35 launcher cold-start test
        id: launcher-smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            gradle --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true
            adb shell am force-stop com.mai.app || true
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.mai.app/.MainActivity
            sleep 45
            adb logcat -d -v threadtime > android-logcat.txt || true
            adb shell dumpsys activity activities > android-activities.txt || true
            ! grep -q "Process: com.mai.app" android-logcat.txt
            grep -q "topResumedActivity=ActivityRecord.*com.mai.app/.MainActivity" android-activities.txt
            touch mai-launch-smoke-passed

      - name: Upload cold-start diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAI-cold-start-diagnostics
          path: |
            android-logcat.txt
            android-activities.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce MAI launcher result
        run: test -f mai-launch-smoke-passed
