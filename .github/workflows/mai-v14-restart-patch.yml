name: MAI V1.4 one-time process restart patch
on:
  push:
    branches: [ mai-v1.1-tamil ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mai-v1.1-tamil
          fetch-depth: 0
      - name: Patch restart-safe service lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/mai/app/recording/RecordingService.kt')
          text = path.read_text()

          old = '''        } catch (t: Throwable) {
            RecordingBus.update {
                it.copy(active = false, status = "error", error = t.message ?: "Unable to start recording")
            }
            releaseWakeLock()
            runCatching { ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE) }
            stopSelf()
        }
        return START_NOT_STICKY
    }'''
          new = '''        } catch (t: Throwable) {
            meetingId?.let { RecordingRestartGuard.clear(this, it) }
            RecordingBus.update {
                it.copy(active = false, status = "error", error = t.message ?: "Unable to start recording")
            }
            releaseWakeLock()
            runCatching { ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE) }
            stopSelf()
        }
        // If Android kills the process while recording, redeliver the original START intent.
        // RecoverableAudioWriter preserves the earlier AAC before the fresh encoder starts.
        return if (running.get()) START_REDELIVER_INTENT else START_NOT_STICKY
    }'''
          if old not in text:
              raise SystemExit('onStartCommand block changed unexpectedly')
          text = text.replace(old, new)

          old = '''        meetingId = id
        startedAt = System.currentTimeMillis()

        val serviceType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {'''
          new = '''        val existingMeeting = runCatching { MaiDb(this).getMeeting(id) }.getOrNull()
        if (existingMeeting == null || existingMeeting.status != "recording") {
            RecordingRestartGuard.clear(this, id)
            RecordingBus.update {
                it.copy(active = false, meetingId = id, status = "error", error = "This meeting is no longer in an active recording state.")
            }
            stopSelf()
            return
        }

        meetingId = id
        startedAt = existingMeeting.startedAt
        RecordingRestartGuard.markActive(this, id)

        val serviceType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {'''
          if old not in text:
              raise SystemExit('startRecording initialization changed unexpectedly')
          text = text.replace(old, new)

          old = '''                        writer.checkpoint()
                        db.checkpointMeeting(id, combinedTranscript(), writer.recoveryPath)
                    }'''
          new = '''                        writer.checkpoint()
                        db.checkpointMeeting(id, combinedTranscript(), writer.recoveryPath)
                        RecordingRestartGuard.heartbeat(this, id)
                    }'''
          if old not in text:
              raise SystemExit('checkpoint block changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''        releaseWakeLock()
        runCatching { ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE) }
        stopSelf()
    }

    private fun enqueueAiEnhancement'''
          new = '''        RecordingRestartGuard.clear(this, id)
        releaseWakeLock()
        runCatching { ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE) }
        stopSelf()
    }

    private fun enqueueAiEnhancement'''
          if old not in text:
              raise SystemExit('finalize cleanup block changed unexpectedly')
          text = text.replace(old, new, 1)
          path.write_text(text)

          app = Path('app/src/main/java/com/mai/app/MaiApplication.kt')
          text = app.read_text()
          old = 'import com.mai.app.recording.RecoverableAudioWriter\n'
          new = 'import com.mai.app.recording.RecoverableAudioWriter\nimport com.mai.app.recording.RecordingRestartGuard\n'
          if old not in text:
              raise SystemExit('MaiApplication import changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''                val db = MaiDb(this)
                db.recoverInterruptedMeetings()
                val retentionDays = settings.getInt("audio_retention_days", 7)'''
          new = '''                val db = MaiDb(this)
                // Application is created before a redelivered foreground service. Give Android
                // a short window to restart the recorder and refresh its persistent heartbeat.
                // If no fresh heartbeat appears, treat the old recording as genuinely interrupted.
                val restartCandidate = RecordingRestartGuard.activeMeetingId(this)
                if (restartCandidate != null) Thread.sleep(12_000L)
                val recordingResumed = restartCandidate != null &&
                    RecordingRestartGuard.isFresh(this, restartCandidate, 15_000L)
                if (!recordingResumed) {
                    restartCandidate?.let { RecordingRestartGuard.clear(this, it) }
                    db.recoverInterruptedMeetings()
                }
                val retentionDays = settings.getInt("audio_retention_days", 7)'''
          if old not in text:
              raise SystemExit('MaiApplication recovery block changed unexpectedly')
          app.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/mai-v14-restart-patch.yml
          git config user.name "MAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/mai/app/recording/RecordingService.kt app/src/main/java/com/mai/app/MaiApplication.kt .github/workflows/mai-v14-restart-patch.yml
          git commit -m "Resume active recording safely after Android process death"
          git push origin HEAD:mai-v1.1-tamil
