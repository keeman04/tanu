name: MAI V1.4 final polish
on:
  push:
    branches: [ mai-v1.1-tamil ]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mai-v1.1-tamil
          fetch-depth: 0
      - name: Add language selector and silence-aware segment boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Settings UI: expose the already-supported multilingual presets.
          ui = Path('app/src/main/java/com/mai/app/ui/MaiRoot.kt')
          text = ui.read_text()
          old = '''    var retention by remember { mutableIntStateOf(prefs.getInt("audio_retention_days", 7)) }
    LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {'''
          new = '''    var retention by remember { mutableIntStateOf(prefs.getInt("audio_retention_days", 7)) }
    var languageMode by remember { mutableStateOf(prefs.getString("transcription_language_mode", "auto") ?: "auto") }
    val languageChoices = listOf(
        "auto" to "Auto detect",
        "ta_en" to "Tamil + English",
        "hi_en" to "Hindi + English",
        "te_en" to "Telugu + English",
        "ml_en" to "Malayalam + English",
        "kn_en" to "Kannada + English",
        "bn_en" to "Bengali + English",
        "mr_en" to "Marathi + English",
        "gu_en" to "Gujarati + English",
        "pa_en" to "Punjabi + English",
        "ur_en" to "Urdu + English"
    )
    LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {'''
          if old not in text:
              raise SystemExit('Settings state anchor not found')
          text = text.replace(old, new, 1)

          old = '''        item { SettingsCard("Speech & AI") { Text("Realtime multilingual preview · Auto detect", fontWeight = FontWeight.SemiBold); Text("Live transcription is only a preview. Auto mode does not force a language. The complete saved audio is processed on the MAI server with resumable multilingual transcription, then converted into the final English transcript and MOM.", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurface.copy(alpha = .5f)) } }'''
          new = '''        item {
            SettingsCard("Speech & AI") {
                Text("Meeting language", fontWeight = FontWeight.SemiBold)
                Text(
                    "Auto detect is recommended. Pick a preset only when the meeting is mainly in that language plus English.",
                    fontSize = 12.sp,
                    color = MaterialTheme.colorScheme.onSurface.copy(alpha = .5f)
                )
                Spacer(Modifier.height(8.dp))
                languageChoices.chunked(2).forEach { pair ->
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                        pair.forEach { (mode, label) ->
                            if (languageMode == mode) {
                                Button(
                                    onClick = {},
                                    modifier = Modifier.weight(1f),
                                    contentPadding = PaddingValues(horizontal = 7.dp, vertical = 8.dp)
                                ) { Text(label, fontSize = 11.sp) }
                            } else {
                                OutlinedButton(
                                    onClick = {
                                        languageMode = mode
                                        prefs.edit().putString("transcription_language_mode", mode).apply()
                                    },
                                    modifier = Modifier.weight(1f),
                                    contentPadding = PaddingValues(horizontal = 7.dp, vertical = 8.dp)
                                ) { Text(label, fontSize = 11.sp) }
                            }
                        }
                        if (pair.size == 1) Spacer(Modifier.weight(1f))
                    }
                    Spacer(Modifier.height(5.dp))
                }
                Text(
                    "Live text is preview-only. The complete saved audio is uploaded resumably and reprocessed for the verified English transcript and structured MOM.",
                    fontSize = 12.sp,
                    color = MaterialTheme.colorScheme.onSurface.copy(alpha = .5f)
                )
            }
        }'''
          if old not in text:
              raise SystemExit('Speech & AI anchor not found')
          ui.write_text(text.replace(old, new, 1))

          # Backend: prefer silence near each target boundary, while retaining 5 sec overlap.
          jobs = Path('backend/jobs.py')
          text = jobs.read_text()
          old = '''def _segment_audio(source: Path, output_dir: Path) -> list[Path]:
    if shutil.which("ffmpeg") is None:
        raise RuntimeError("ffmpeg is required on the MAI backend")
    duration = _duration_seconds(source)
    if duration <= 0:
        raise RuntimeError("Meeting audio contains no usable duration")
    output_dir.mkdir(parents=True, exist_ok=True)
    starts: list[float] = []
    position = 0.0
    while position < duration:
        starts.append(position)
        position += SEGMENT_SECONDS
    segments: list[Path] = []
    for index, start in enumerate(starts):
        target = output_dir / f"segment-{index:04d}.mp3"
        length = min(float(SEGMENT_SECONDS + SEGMENT_OVERLAP_SECONDS), duration - start)
        command = [
            "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
            "-ss", f"{start:.3f}", "-i", str(source), "-t", f"{length:.3f}",
            "-vn", "-ac", "1", "-ar", "16000", "-b:a", "32k", str(target),
        ]
        completed = subprocess.run(command, capture_output=True, text=True, timeout=20 * 60)
        if completed.returncode != 0 or not target.is_file() or target.stat().st_size <= 512:
            raise RuntimeError(f"Audio segment {index + 1} conversion failed: {completed.stderr[-300:]}")
        segments.append(target)
    return segments
'''
          new = '''def _silence_midpoints(source: Path) -> list[float]:
    """Find usable silence centers without making silence detection a hard dependency."""
    if shutil.which("ffmpeg") is None:
        return []
    completed = subprocess.run(
        [
            "ffmpeg", "-hide_banner", "-nostats", "-i", str(source),
            "-af", "silencedetect=noise=-38dB:d=0.35", "-f", "null", "-",
        ],
        capture_output=True,
        text=True,
        timeout=20 * 60,
    )
    if completed.returncode != 0:
        return []
    starts: list[float] = []
    mids: list[float] = []
    for line in completed.stderr.splitlines():
        start_match = re.search(r"silence_start:\\s*([0-9.]+)", line)
        if start_match:
            starts.append(float(start_match.group(1)))
        end_match = re.search(r"silence_end:\\s*([0-9.]+)", line)
        if end_match:
            end = float(end_match.group(1))
            start = starts.pop(0) if starts else max(0.0, end - 0.35)
            mids.append((start + end) / 2.0)
    return mids


def _choose_segment_boundaries(duration: float, silence_points: list[float]) -> list[float]:
    if duration <= 0:
        return [0.0]
    boundaries = [0.0]
    current = 0.0
    search_radius = min(60.0, max(20.0, SEGMENT_SECONDS * 0.12))
    minimum_segment = min(120.0, SEGMENT_SECONDS * 0.4)
    while current + SEGMENT_SECONDS < duration:
        target = current + SEGMENT_SECONDS
        candidates = [
            point for point in silence_points
            if target - search_radius <= point <= target + search_radius
            and point - current >= minimum_segment
            and duration - point >= minimum_segment
        ]
        boundary = min(candidates, key=lambda point: abs(point - target)) if candidates else target
        if boundary <= current + 1.0:
            boundary = target
        boundaries.append(min(boundary, duration))
        current = boundaries[-1]
    if boundaries[-1] < duration:
        boundaries.append(duration)
    return boundaries


def _segment_audio(source: Path, output_dir: Path) -> list[Path]:
    if shutil.which("ffmpeg") is None:
        raise RuntimeError("ffmpeg is required on the MAI backend")
    duration = _duration_seconds(source)
    if duration <= 0:
        raise RuntimeError("Meeting audio contains no usable duration")
    output_dir.mkdir(parents=True, exist_ok=True)
    boundaries = _choose_segment_boundaries(duration, _silence_midpoints(source))
    segments: list[Path] = []
    for index in range(len(boundaries) - 1):
        logical_start = boundaries[index]
        logical_end = boundaries[index + 1]
        start = max(0.0, logical_start - (SEGMENT_OVERLAP_SECONDS if index > 0 else 0.0))
        length = logical_end - start
        target = output_dir / f"segment-{index:04d}.mp3"
        command = [
            "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
            "-ss", f"{start:.3f}", "-i", str(source), "-t", f"{length:.3f}",
            "-vn", "-ac", "1", "-ar", "16000", "-b:a", "32k", str(target),
        ]
        completed = subprocess.run(command, capture_output=True, text=True, timeout=20 * 60)
        if completed.returncode != 0 or not target.is_file() or target.stat().st_size <= 512:
            raise RuntimeError(f"Audio segment {index + 1} conversion failed: {completed.stderr[-300:]}")
        segments.append(target)
    return segments
'''
          if old not in text:
              raise SystemExit('segment_audio anchor not found')
          jobs.write_text(text.replace(old, new, 1))

          tests = Path('backend/tests/test_jobs.py')
          text = tests.read_text()
          text += '''\n\ndef test_silence_aware_boundaries_prefer_pause_near_target():\n    old_seconds = jobs.SEGMENT_SECONDS\n    try:\n        jobs.SEGMENT_SECONDS = 420\n        boundaries = jobs._choose_segment_boundaries(1000.0, [405.0, 419.5, 447.0, 838.0])\n        assert boundaries[0] == 0.0\n        assert abs(boundaries[1] - 419.5) < 0.01\n        assert abs(boundaries[2] - 838.0) < 0.01\n        assert boundaries[-1] == 1000.0\n    finally:\n        jobs.SEGMENT_SECONDS = old_seconds\n\n\ndef test_silence_aware_boundaries_fall_back_to_target_when_no_pause_exists():\n    old_seconds = jobs.SEGMENT_SECONDS\n    try:\n        jobs.SEGMENT_SECONDS = 420\n        boundaries = jobs._choose_segment_boundaries(900.0, [])\n        assert boundaries == [0.0, 420.0, 900.0]\n    finally:\n        jobs.SEGMENT_SECONDS = old_seconds\n'''
          tests.write_text(text)

          env = Path('backend/.env.example')
          text = env.read_text().replace(
              '# Accuracy: overlapping 7-minute chunks with independent retry/checkpointing.',
              '# Accuracy: silence-aware ~7-minute chunks with 5-second overlap and independent retry/checkpointing.'
          )
          env.write_text(text)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/mai-v14-final-polish.yml
          git config user.name "MAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/mai/app/ui/MaiRoot.kt backend/jobs.py backend/tests/test_jobs.py backend/.env.example .github/workflows/mai-v14-final-polish.yml
          git commit -m "Add language presets and silence-aware chunk boundaries"
          git push origin HEAD:mai-v1.1-tamil
