name: MAI Final Certification
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: mai-final-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-backend:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      MAI_BACKEND_URL: ${{ secrets.MAI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require production MAI backend configuration
        run: |
          test -n "$MAI_BACKEND_URL" || { echo "::error::MAI_BACKEND_URL is required for final certification"; exit 1; }
          case "$MAI_BACKEND_URL" in
            https://*) ;;
            *) echo "::error::MAI_BACKEND_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Verify live backend health and device-auth readiness
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ['MAI_BACKEND_URL'].rstrip('/')
          with urllib.request.urlopen(base + '/health', timeout=20) as response:
              health = json.load(response)
          if not health.get('ok') or not health.get('openai_configured') or not health.get('ffmpeg'):
              raise SystemExit(f'Backend health is not production-ready: {health}')
          with urllib.request.urlopen(base + '/v1/auth/status', timeout=20) as response:
              auth = json.load(response)
          if not auth.get('device_auth') or not auth.get('enrollment_configured'):
              raise SystemExit(f'Per-device authentication is not production-ready: {auth}')
          print('Production MAI backend health and per-device authentication readiness passed.')
          PY
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Reject shared backend secrets in Android
        run: |
          if grep -R "MAI_GATEWAY_TOKEN" app/src app/build.gradle.kts; then
            echo "::error::Shared MAI gateway token must never be compiled into the APK."
            exit 1
          fi
      - name: Build hardened QA APK with production endpoint
        run: gradle --no-daemon assembleQa -PMAI_BACKEND_URL="$MAI_BACKEND_URL"
      - name: Validate hardened APK
        run: |
          APK=app/build/outputs/apk/qa/app-qa.apk
          test -f "$APK"
          SIZE=$(stat -f%z "$APK")
          test "$SIZE" -le $((50 * 1024 * 1024)) || { echo "::error::Certified APK exceeds 50 MiB"; exit 1; }
          ! unzip -l "$APK" | grep -Eiq 'vosk|model-en-us' || { echo "::error::Vosk payload found in certified APK"; exit 1; }
          echo "Certified APK size: $SIZE bytes"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend architecture and accuracy tests
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          PYTHONPATH=. pytest -q
          python -m py_compile app.py device_auth.py jobs.py job_cleanup.py job_segmentation.py accuracy.py accuracy_metrics.py multilingual_benchmark.py realtime.py secure_app.py e2e_certify.py
      - name: Upload certified APK
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.4.1-Verified-Multilingual-Final-Candidate
          path: app/build/outputs/apk/qa/app-qa.apk
          retention-days: 30
          if-no-files-found: error

  android-runtime:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android ${{ matrix.api-level }} launcher + integration certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/mai_launcher_smoke.sh
