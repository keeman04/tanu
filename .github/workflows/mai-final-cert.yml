name: MAI Final Certification
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: mai-final-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-backend:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      MAI_BACKEND_URL: ${{ secrets.MAI_BACKEND_URL }}
      MAI_GATEWAY_TOKEN: ${{ secrets.MAI_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require production MAI backend configuration
        run: |
          test -n "$MAI_BACKEND_URL" || { echo "::error::MAI_BACKEND_URL is required for final certification"; exit 1; }
          test -n "$MAI_GATEWAY_TOKEN" || { echo "::error::MAI_GATEWAY_TOKEN is required for final certification"; exit 1; }
          case "$MAI_BACKEND_URL" in
            https://*) ;;
            *) echo "::error::MAI_BACKEND_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Verify live backend health and realtime auth
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ['MAI_BACKEND_URL'].rstrip('/')
          token = os.environ['MAI_GATEWAY_TOKEN']
          with urllib.request.urlopen(base + '/health', timeout=20) as response:
              health = json.load(response)
          if not health.get('ok') or not health.get('openai_configured') or not health.get('ffmpeg'):
              raise SystemExit(f'Backend health is not production-ready: {health}')
          body = json.dumps({'participants': ['MAI Certification']}).encode()
          request = urllib.request.Request(
              base + '/v1/realtime/client-secret',
              data=body,
              method='POST',
              headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              secret = json.load(response)
          if not str(secret.get('value', '')).startswith('ek_'):
              raise SystemExit('Backend did not return a valid short-lived realtime client secret')
          if not str(secret.get('websocket_url', '')).startswith('wss://'):
              raise SystemExit('Backend returned an invalid realtime WebSocket URL')
          print('Production MAI backend health and realtime authentication passed.')
          PY
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build hardened QA APK with production endpoint
        run: gradle --no-daemon assembleQa -PMAI_BACKEND_URL="$MAI_BACKEND_URL" -PMAI_GATEWAY_TOKEN="$MAI_GATEWAY_TOKEN"
      - name: Validate hardened APK
        run: |
          APK=app/build/outputs/apk/qa/app-qa.apk
          test -f "$APK"
          SIZE=$(stat -f%z "$APK")
          test "$SIZE" -le $((50 * 1024 * 1024)) || { echo "::error::Certified APK exceeds 50 MiB"; exit 1; }
          ! unzip -l "$APK" | grep -Eiq 'vosk|model-en-us' || { echo "::error::Vosk payload found in certified APK"; exit 1; }
          echo "Certified APK size: $SIZE bytes"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          PYTHONPATH=. pytest -q
          python -m py_compile app.py
      - name: Upload certified APK
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.3.0-Final-Candidate
          path: app/build/outputs/apk/qa/app-qa.apk
          retention-days: 30
          if-no-files-found: error

  android-runtime:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android ${{ matrix.api-level }} launcher + integration certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/mai_launcher_smoke.sh
