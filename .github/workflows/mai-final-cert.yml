name: MAI Final Certification
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: mai-final-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-backend:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          PYTHONPATH=. pytest -q
          python -m py_compile app.py
      - name: Upload certified APK
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.1.0-RC1-Final-Candidate
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  android-runtime:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android ${{ matrix.api-level }} launcher + integration certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/mai_launcher_smoke.sh
